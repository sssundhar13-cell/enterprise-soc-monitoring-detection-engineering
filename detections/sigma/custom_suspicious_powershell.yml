
title: Suspicious PowerShell Execution
id: 8f2a1c4d-6b7e-4a90-b123-5d6e7f8a9b10
status: experimental
description: Detects suspicious PowerShell execution involving encoded commands and download activity.
author: SOC Detection Engineering Lab
date: 2026/11/16

logsource:
    category: process_creation
    product: windows

detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'

    selection_encoded:
        CommandLine|contains:
            - '-EncodedCommand'
            - '-enc '
            - '/enc '

    selection_download:
        CommandLine|contains:
            - 'DownloadString'
            - 'Invoke-WebRequest'
            - 'Start-BitsTransfer'
            - 'Net.WebClient'

    condition: selection_image and (selection_encoded or selection_download)

falsepositives:
    - Legitimate administrative PowerShell scripts
    - Authorized software deployment activity

level: high

tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense-evasion
    - attack.t1027

