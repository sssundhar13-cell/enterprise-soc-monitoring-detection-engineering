
title: Certutil Download Activity
id: 7d9e3a21-8b45-4f62-a123-9c8d7e6f5a40
status: experimental
description: Detects certutil.exe being used to download files from a remote URL.
author: SOC Detection Engineering Lab
date: 2026/11/16

logsource:
    category: process_creation
    product: windows

detection:
    selection_image:
        Image|endswith: '\certutil.exe'

    selection_command:
        CommandLine|contains|all:
            - '-urlcache'
            - 'http'

    condition: selection_image and selection_command

falsepositives:
    - Legitimate administrative use of certutil

level: medium

tags:
    - attack.command-and-control
    - attack.t1105

